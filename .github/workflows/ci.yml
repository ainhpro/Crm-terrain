name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Isolation des comptes testée sur un Postgres jetable (PostgreSQL est préinstallé sur le runner).
      - run: npm run test:db
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
